name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 20
            homebridge: 1.8.4
          - node: 22
            homebridge: 2.4.0
          - node: 24
            homebridge: 2.4.0
          - node: 26
            homebridge: 2.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts homebridge@${{ matrix.homebridge }}
      - run: npm run check
      - run: npm pack --dry-run
